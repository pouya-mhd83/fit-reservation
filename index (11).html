<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فیت‌رزرو | سامانه رزرو سانس و مدیریت ظرفیت باشگاه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--tx:#0f1f3d;--mut:#64748b;--bd:#e5eaf1;--g:#16a34a;--g2:#ecfdf3;--bg:#f8fafc;--card:#fff;--soft:#f1f5f9}
*{box-sizing:border-box}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
svg.lucide{width:18px;height:18px;stroke-width:1.7;flex-shrink:0}
small{color:var(--mut);font-size:12px}
.app{display:flex;min-height:100vh}
aside{width:270px;background:var(--card);border-left:1px solid var(--bd);padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;flex-shrink:0}
.lg{display:flex;align-items:center;gap:12px;margin-bottom:22px;padding:0 6px}.lg b{font-size:20px;display:block}
.lgi{width:52px;height:52px;border-radius:16px;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center}.lgi svg{width:28px;height:28px;stroke-width:1.9}
.sl{color:var(--mut);font-size:12px;padding:0 10px;margin-bottom:4px}
aside a{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;cursor:pointer;color:var(--tx)}
aside a:hover{background:var(--soft)}aside a.on{background:var(--g2);color:var(--g);font-weight:700}
.nb{margin-inline-start:auto;font-style:normal;background:#fee2e2;color:#dc2626;border-radius:20px;padding:1px 9px;font-size:12px}
.help{background:var(--soft);border-radius:14px;padding:14px;display:flex;gap:10px;margin-top:12px;cursor:pointer}.help b{display:block;font-size:13px}
.lo{margin-top:auto}
main{flex:1;min-width:0}
.tp{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-bottom:1px solid var(--bd);padding:14px 40px;position:relative}
.dt,.us{display:flex;align-items:center;gap:10px}.dt{color:var(--mut)}.us b{display:block}
.us{position:relative}
.av{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;background:#dbeafe;color:#1d4ed8}
.av.c1{background:#dcfce7;color:#15803d;width:48px;height:48px;font-size:15px}.av.c2{background:#fce7f3;color:#be185d}.av.c3{background:#ffedd5;color:#c2410c}.av.c4{background:#d1fae5;color:#047857}.av.c0{background:#ede9fe;color:#6d28d9}
.bell{position:relative;background:none;border:0;cursor:pointer;color:var(--tx);padding:6px}.dot{position:absolute;top:4px;left:6px;width:8px;height:8px;border-radius:50%;background:#ef4444}
.nt{position:absolute;top:62px;left:0;width:370px;background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:0 10px 30px #0f1f3d22;padding:16px;z-index:20}
.nh{display:flex;justify-content:space-between;border-bottom:1px solid var(--bd);padding-bottom:10px;margin-bottom:6px}.nh a{color:var(--g);cursor:pointer;font-size:12px}
.ni{padding:10px 0;border-bottom:1px solid var(--bd)}.ni:last-child{border:0}.ni b{display:inline-flex;align-items:center;gap:8px;font-size:13px}.ni small{display:block;margin-top:4px}
.d{width:9px;height:9px;border-radius:50%;display:inline-block}.d.o{background:#f59e0b}.d.g{background:#16a34a}
.cn{padding:28px 40px;max-width:1300px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{margin:0 0 6px;font-size:26px;font-weight:800}.ph p{margin:0;color:var(--mut)}
.bt{font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--g);color:#fff;border:0;padding:12px 22px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:500;box-shadow:0 6px 14px #16a34a33}
.bt:hover{filter:brightness(.95)}.bt.o{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none}.bt.rd{background:#dc4444;box-shadow:none}.bt.s{padding:8px 14px;font-size:13px}.bt:disabled{opacity:.4;cursor:not-allowed}
.cd{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px;margin-bottom:20px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}.ch h3{margin:0 0 4px;font-size:17px}
.sg4{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;margin-bottom:20px}
.sc{display:flex;justify-content:space-between;align-items:center;margin:0}.sc b{font-size:28px;display:block;margin:6px 0}
.ibx{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.ibx.b,.ai.b{background:#e0e7ff;color:#4f46e5}.ibx.g,.ai.g{background:#dcfce7;color:#16a34a}.ibx.o,.ai.o{background:#ffedd5;color:#ea580c}.ibx.r,.ai.r{background:#fee2e2;color:#dc2626}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}
.rw{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--bd)}.rw:last-child{border:0}
.tm{display:flex;align-items:center;gap:8px;width:150px;font-weight:500}
.br{flex:1;height:8px;border-radius:8px;background:var(--soft);overflow:hidden}.br i{display:block;height:100%;background:#16a34a;border-radius:8px}.br i.or{background:#f59e0b}
.cnt{width:90px;font-size:13px}
.ac{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--bd);align-items:center}.ac:last-child{border:0}.ac p{margin:0 0 3px;font-size:13px}
.ai{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lk{color:var(--g);cursor:pointer;font-size:13px}
.in{font-family:inherit;width:100%;height:46px;padding:0 14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font-size:14px;margin:6px 0 14px}.in.w{width:auto;min-width:180px;margin:0}
textarea.in{height:90px;padding:12px}
label{font-size:13px;font-weight:500}
.fl{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px}.fl .in{margin:0;flex:1;min-width:160px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th{background:var(--soft);color:var(--mut);font-weight:500;font-size:12px;text-align:right;padding:12px}
td{padding:14px 12px;border-bottom:1px solid var(--bd);text-align:right}.r{text-align:right}
.who{display:flex;align-items:center;gap:12px}
.bd{display:inline-block;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}
.bd.g{background:#dcfce7;color:#15803d}.bd.o{background:#fef3c7;color:#b45309}.bd.r{background:#fee2e2;color:#b91c1c}.bd.x{background:var(--soft);color:var(--mut)}
.ib{width:40px;height:40px;border-radius:10px;border:1px solid var(--bd);background:var(--card);cursor:pointer;color:var(--tx);display:inline-flex;align-items:center;justify-content:center}
.pgr{display:flex;justify-content:space-between;align-items:center;margin-top:18px;flex-wrap:wrap;gap:8px}.pgr>div{display:flex;gap:6px}
.pb{width:38px;height:38px;border-radius:10px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-family:inherit}.pb.on{background:var(--tx);color:var(--card)}.pb:disabled{opacity:.4}
.bn{display:flex;gap:12px;align-items:center;border-radius:14px;padding:16px 20px;margin-bottom:20px}.bn b{display:block}
.bn.info{background:#eaf3fd;color:#1e40af}.bn.warn{background:#fdf5e1;color:#a16207}.bn small{color:inherit}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}.wk div{background:var(--soft);border-radius:12px;padding:16px 8px;text-align:center}.wk small{display:block;margin-top:4px}.wk .off{background:#fee2e2;color:#dc2626}.wk .off small{color:#dc2626}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.sk{border:1px solid var(--bd);border-radius:16px;padding:16px}.sk>small{color:var(--g);font-weight:700}.sk>b{display:block;font-size:17px;margin:8px 0}.sk p{margin:4px 0;color:var(--mut);display:flex;align-items:center;gap:6px;font-size:13px}.sk a{display:flex;gap:6px;align-items:center;cursor:pointer;border-top:1px solid var(--bd);margin-top:12px;padding-top:12px;font-size:13px}
.dbx{width:52px;height:56px;border-radius:12px;background:var(--soft);text-align:center;padding-top:8px;flex-shrink:0}.dbx b{display:block;font-size:18px}
.bl{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--bd)}.bl:last-child{border:0}.bl>div:nth-child(2){flex:1}.bl p{margin:0 0 2px;font-weight:500}
.sm{display:flex;gap:26px;background:var(--soft);border-radius:14px;padding:16px 20px;margin-bottom:10px;align-items:center}.sm b{font-size:20px;margin-inline-end:4px}
.ar{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--bd)}.ar>div:nth-child(2){flex:1}.ar small{display:block}
.pbt{font-family:inherit;display:inline-flex;gap:6px;align-items:center;padding:9px 16px;border:1px solid var(--bd);border-radius:10px;background:var(--card);cursor:pointer;margin-inline-start:8px;font-size:13px}.pbt.g{background:var(--g2);border-color:#86efac;color:#15803d}.pbt.r{background:#fee2e2;border-color:#fca5a5;color:#b91c1c}
.rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:20px}
.rb{background:var(--soft);border-radius:14px;padding:16px;margin:14px 0;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.rb small{display:block;margin-bottom:6px}.rb div{display:flex;flex-direction:column;gap:2px}
.chips{display:flex;gap:10px;overflow-x:auto;margin-bottom:18px}.chips button{min-width:120px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:13px 22px;border-radius:12px;color:#fff;display:none;z-index:99;max-width:90%;text-align:center;box-shadow:0 8px 24px #0003}
#toast.ok{background:#16a34a}#toast.er{background:#dc2626}
#modal{position:fixed;inset:0;background:#0f1f3d88;display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
.mb{background:var(--card);border-radius:20px;padding:24px;width:100%;max-width:460px;max-height:92vh;overflow:auto}.mb h3{margin:0 0 16px}.ac2{display:flex;gap:10px;margin-top:6px}

/* ===== ابزارها ===== */
const $=s=>document.querySelector(s);
const lu=()=>{};
const IC={dumbbell:'<rect x="5" y="6" width="3" height="12" rx="1"/><rect x="16" y="6" width="3" height="12" rx="1"/><path d="M2 9v6M22 9v6M8 12h8"/>',
'layout-grid':'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>',
users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',ban:'<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/>',
calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
'check-circle':'<circle cx="12" cy="12" r="10"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/>',
'message-square':'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>','message-circle':'<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
'log-out':'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',plus:'<path d="M5 12h14M12 5v14"/>',
pencil:'<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5zM15 5l4 4"/>',
'chevron-right':'<path d="m9 18 6-6-6-6"/>','chevron-left':'<path d="m15 18-6-6 6-6"/>',
'credit-card':'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
send:'<path d="m22 2-7 20-4-9-9-4zM22 2 11 13"/>'};
const ic=n=>`<svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]||''}</svg>`;
const P=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const esc=t=>{const d=document.createElement('div');d.textContent=t;return d.innerHTML};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=n=>{const x=new Date();x.setDate(x.getDate()+n);return ymd(x)};
const today=()=>ymd(new Date());
const WD=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'],ORD=[6,0,1,2,3,4,5];
const wdOf=d=>new Date(d+'T00:00').getDay();
const fdl=(d,o)=>new Date(d+'T00:00').toLocaleDateString('fa-IR',o);
const fd=(d,y)=>WD[wdOf(d)]+'، '+fdl(d,{day:'numeric',month:'long',...(y?{year:'numeric'}:{})});
const fd0=d=>fdl(d,{day:'numeric',month:'long',year:'numeric'});
const mins=s=>+s.slice(0,2)*60+ +s.slice(3);
const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const rg=(s,d)=>P(s)+' تا '+P(hm(mins(s)+d));
const st=(d,s)=>new Date(d+'T'+s);
const rel=d=>d==today()?'امروز':d==addD(1)?'فردا':d==addD(-1)?'دیروز':fd(d);
const tOf=t=>{const x=new Date(t);return hm(x.getHours()*60+x.getMinutes())};
const fat=t=>rel(ymd(new Date(t)))+'، '+P(tOf(t));
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?'لحظاتی پیش':m<60?P(m)+' دقیقه پیش':m<1440?P(Math.floor(m/60))+' ساعت پیش':P(Math.floor(m/1440))+' روز پیش'};
const ini=n=>{const p=n.trim().split(/\s+/);return p[0][0]+(p[1]?p[1][0]:p[0][1]||'')};
const av=n=>`<span class="av c${n.length%5}">${esc(ini(n))}</span>`;
const bd=([t,c])=>`<span class="bd ${c}">${t}</span>`;
function toast(t,type='ok'){const e=$('#toast');e.textContent=t;e.className=type;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',4500)}
function openM(h){$('#modal').innerHTML=`<div class="mb">${h}</div>`;$('#modal').style.display='flex';lu()}
const closeM=()=>{$('#modal').style.display='none'};
const dopts=(sel,a,b)=>{let o='';for(let i=a;i<=b;i++){const d=addD(i);o+=`<option value="${d}" ${d==sel?'selected':''}>${fd(d)}</option>`}return o};
const ph=(t,s,b)=>`<div class="ph"><div><h1>${t}</h1><p>${s}</p></div>${b||''}</div>`;

/* ===== داده‌ها ===== */
const K='gym_v4';
function seed(){
 const at=m=>{const t=new Date(Date.now()+m*6e4);return{date:ymd(t),start:hm(t.getHours()*60+Math.ceil(t.getMinutes()/5)*5)}};
 const T=[['08:00',120,12],['10:30',120,12],['13:00',120,12],['16:00',120,15],['18:30',120,15]],slots={},hours={};let k=1;
 [6,0,1,2,3,4].forEach(w=>{slots[w]=T.map(([start,dur,cap])=>({id:k++,start,dur,cap}));hours[w]={o:'07:00',c:'21:00'}});hours[5]=null;slots[5]=[];
 const M=[['کیا نوروزی','kia.norouzi',60,17],['سارا احمدی','sara.ahmadi',45,12],['امیرحسین رضایی','amir.rezaei',10,3],['نگار کریمی','negar.karimi',-20,0],['پارسا اکبری','parsa.akbari',120,21],['کیارا مرادی','kiara.moradi',50,12],['علی سعیدی','ali.saeidi',30,9],['نیلوفر مرادی','niloofar.moradi',70,15],['محمد صادقی','mohammad.sadeghi',90,24],['هانیه کاظمی','hanieh.kazemi',5,2],['رضا بهرامی','reza.bahrami',200,30],['مهسا نیک‌پور','mahsa.nikpour',15,4]];
 const users=[{id:1,name:'رضا قاسمی',email:'admin@gym.ir',pass:'admin123',role:'m'},...M.map(([n,e,d,s],i)=>({id:i+2,name:n,email:e+'@gmail.com',pass:'1234',role:'a',expiry:addD(d),sessions:s,code:1022+i,joined:addD(-(i*4+3)),pack:[12,24,36].find(x=>x>=s)||48,startD:addD(d-90)}))];
 const td=today(),mk=(id,uid,date,start,status,ago)=>({id,uid,date,start,dur:120,status,at:Date.now()-ago*6e4});
 const n1=at(45),n2=at(80),n3=at(110);
 const bookings=[mk(1,2,td,'08:00','present',900),mk(2,6,td,'08:00','present',800),mk(3,8,td,'08:00','active',700),mk(4,9,td,'08:00','active',600),mk(5,10,td,'08:00','active',500),mk(6,11,td,'08:00','active',400),
  mk(7,12,td,'10:30','active',300),mk(8,13,td,'10:30','active',200),{...mk(9,3,n1.date,n1.start,'active',1200)},{...mk(10,4,n2.date,n2.start,'active',1000)},{...mk(11,7,n3.date,n3.start,'active',100)},mk(12,2,addD(-1),'10:30','present',2000),mk(13,5,addD(-2),'16:00','cancelled',3000),...[-3,-5,-7,-9,-11].map((o,i)=>mk(20+i,2,addD(o),['08:00','10:30','13:00','16:00','18:30'][i],'present',9000+i)),{...mk(30,2,addD(2),'16:00','active',500),code:'FR-1405-8291'}];
 const reqs=[[1,3,9,'حالت تهوع و شرایط جسمانی نامناسب'],[2,4,10,'جلسه کاری پیش‌بینی‌نشده'],[3,7,11,'آسیب‌دیدگی پا در تمرین قبلی']].map(([id,uid,bid,reason])=>({id,uid,bid,reason,status:'p',time:Date.now()-2e5}));
 const A=(k,n,x,m)=>({k,n,x,t:Date.now()-m*6e4});
 return{nid:50,hours,slots,users,bookings,reqs,msgs:[{id:1,uid:2,from:'m',text:'سلام کیا عزیز، چطور می‌تونم کمک کنم؟',time:new Date().setHours(10,12,0,0)}],
  blocks:[{id:1,date:addD(4),start:'all',reason:'تعطیلی رسمی'},{id:2,date:addD(8),start:'18:30',reason:'سرویس تجهیزات'},{id:3,date:addD(12),start:'08:00',reason:'نظافت دوره‌ای'}],
  acts:[A('bk','کیا نوروزی','سانس ۰۸:۰۰ را رزرو کرد.',5),A('rq','سارا احمدی','درخواست لغو ارسال کرد.',18),A('mem','کیارا مرادی','به اعضا اضافه شد.',60),A('blk','','سانس ۱۳:۰۰ امروز مسدود شد.',120)],
  notes:[{id:1,title:'درخواست لغو جدید',text:'سارا احمدی درخواست لغو سانس امروز را ارسال کرد.',c:'o',read:0,to:'m'},{id:2,title:'تکمیل ظرفیت',text:'ظرفیت سانس ۱۸:۳۰ امروز تکمیل شد.',c:'g',read:0,to:'m'},{id:3,title:'رزرو تأییدشده',text:'رزرو شما برای دو روز دیگر ساعت ۱۶:۰۰ تأیید شده است.',c:'g',read:0,to:2}]}}
let db=JSON.parse(localStorage.getItem(K)||'null')||seed();
let meId=+localStorage.gym_me||0,page='dash',nOpen=false,fp=0,rc=null;
const F={mq:'',mst:'',mse:'',mp:1,bq:'',bd:'',bs:'',bst:'',bp:1,sd:today(),bkd:addD(2),ad:today(),as:'',cd:null,tab:'act',wk:0,step:'pick',sel:null,msg:'',ok:false,lb:0,cu:0};
const save=()=>{localStorage.setItem(K,JSON.stringify(db));render()};
const U=id=>db.users.find(u=>u.id==id),BK=id=>db.bookings.find(b=>b.id==id);
const act=(k,n,x)=>db.acts.unshift({k,n,x,t:Date.now()});
const note=(title,text,c,to='m')=>db.notes.unshift({id:db.nid++,title,text,c,read:0,to});
const slotsOn=d=>db.hours[wdOf(d)]?db.slots[wdOf(d)]||[]:[];
const isBlk=(d,t)=>db.blocks.some(b=>b.date==d&&(b.start=='all'||b.start==t));
function inf(d,s){const used=db.bookings.filter(b=>b.date==d&&b.start==s.start&&b.status!='cancelled').length;return{s,used,cap:s.cap,left:s.cap-used,blocked:isBlk(d,s.start),h:(st(d,s.start)-new Date())/36e5}}
const pend=bid=>db.reqs.some(r=>r.bid==bid&&r.status=='p');
const mst=u=>u.sessions<=0||u.expiry<today()?['منقضی‌شده','r']:(st(u.expiry,'00:00')-new Date())/864e5<=14||u.sessions<=3?['رو به اتمام','o']:['فعال','g'];
const bl=b=>b.status=='cancelled'?['لغوشده','r']:pend(b.id)?['در انتظار','o']:b.status=='present'?['حاضر','g']:b.status=='absent'?['غایب','r']:['تأییدشده','g'];

/* ===== ورود و بازیابی رمز ===== */
function login(){const u=db.users.find(x=>x.email==$('#em').value.trim().toLowerCase()&&x.pass==$('#pw').value);
 if(!u)return toast('ایمیل یا رمز عبور اشتباه است.','er');
 meId=u.id;localStorage.gym_me=u.id;page='dash';render()}
function logout(){meId=0;localStorage.gym_me=0;nOpen=false;render()}
function sendCode(){const u=db.users.find(x=>x.role=='a'&&x.email==$('#em').value.trim().toLowerCase());
 if(!u)return toast('ورزشکاری با این ایمیل یافت نشد.','er');
 rc={uid:u.id,code:Math.floor(100000+Math.random()*900000),exp:Date.now()+90000};fp=2;render()}
function resetPw(){if(Date.now()>rc.exp)return toast('کد تأیید منقضی شده است؛ دوباره درخواست دهید.','er');
 if($('#cd').value.trim()!=rc.code)return toast('کد تأیید نادرست است.','er');
 if($('#np').value.length<4)return toast('رمز جدید باید حداقل ۴ کاراکتر باشد.','er');
 U(rc.uid).pass=$('#np').value;fp=0;save();toast('رمز عبور تغییر کرد. وارد شوید.')}
function loginV(){let b;
 if(fp==0)b=`<h3>ورود به حساب کاربری</h3><label>ایمیل</label><input id="em" class="in" dir="ltr"><label>رمز عبور</label><input id="pw" type="password" class="in" dir="ltr" onkeydown="if(event.key=='Enter')login()"><button class="bt" style="width:100%" onclick="login()">ورود</button><p><a class="lk" onclick="fp=1;render()">رمز عبور را فراموش کرده‌ام</a></p><div class="hint">حساب‌های آزمایشی:<br>مدیر: admin@gym.ir ـ رمز: admin123<br>ورزشکار: kia.norouzi@gmail.com ـ رمز: 1234</div>`;
 else if(fp==1)b=`<h3>بازیابی رمز عبور</h3><label>ایمیل خود را وارد کنید</label><input id="em" class="in" dir="ltr"><button class="bt" style="width:100%" onclick="sendCode()">ارسال کد تأیید</button><p><a class="lk" onclick="fp=0;render()">بازگشت</a></p>`;
 else b=`<h3>تعیین رمز جدید</h3><div class="hint" style="margin:0 0 14px">کد تأیید (شبیه‌سازی ایمیل): <b>${P(rc.code)}</b><br>این کد ۹۰ ثانیه اعتبار دارد.</div><label>کد تأیید</label><input id="cd" class="in" dir="ltr"><label>رمز عبور جدید</label><input id="np" type="password" class="in" dir="ltr"><button class="bt" style="width:100%" onclick="resetPw()">ثبت رمز جدید</button><p><a class="lk" onclick="fp=0;render()">انصراف</a></p>`;
 return `<div class="lgn"><div class="cd"><div class="lg"><div class="lgi">${ic('dumbbell')}</div><div><b>فیت‌رزرو</b><small>باشگاه انرژی پلاس</small></div></div>${b}</div></div>`}

/* ===== رزرو، لغو و درخواست‌ها ===== */
function chk(date,start){const u=U(meId),s=slotsOn(date).find(x=>x.start==start),i=inf(date,s);
 if(u.expiry<date)return 'عضویت شما تا این تاریخ معتبر نیست.';
 if(u.sessions<=0)return 'جلسه‌ی باقی‌مانده‌ای ندارید.';
 if(i.blocked)return 'این سانس مسدود شده است.';
 if(i.left<=0)return 'ظرفیت این بازه پر شده است، لطفاً زمان دیگری انتخاب کنید.';
 if(db.bookings.some(b=>b.uid==u.id&&b.date==date&&b.status!='cancelled'))return 'هر ورزشکار در هر روز فقط می‌تواند یک سانس رزرو کند.';
 if(i.h<6||i.h>24)return 'رزرو فقط از ۲۴ ساعت تا ۶ ساعت مانده به شروع سانس امکان‌پذیر است.';
 return ''}
function book(date,start){const e=chk(date,start);if(e){toast(e,'er');return null}
 const u=U(meId),s=slotsOn(date).find(x=>x.start==start),i=inf(date,s),yr=new Date().toLocaleDateString('fa-IR-u-nu-latn',{year:'numeric'});
 u.sessions--;const b={id:db.nid++,uid:u.id,date,start,dur:s.dur,status:'active',at:Date.now(),code:'FR-'+yr+'-'+(1000+Math.floor(Math.random()*9000))};db.bookings.push(b);
 act('bk',u.name,`سانس ${P(start)} را رزرو کرد.`);
 if(i.left==1)note('تکمیل ظرفیت',`ظرفیت سانس ${P(start)} ${rel(date)} تکمیل شد.`,'g');
 return b}
function cancelB(id){const b=BK(id);
 if((st(b.date,b.start)-new Date())/36e5<2)return reqForm(id);
 if(!confirm('این رزرو لغو شود؟'))return;b.status='cancelled';U(b.uid).sessions++;save();toast('رزرو لغو شد و یک جلسه به عضویت شما بازگشت.')}
const RS=['بیماری یا شرایط جسمانی نامناسب','کار یا جلسه‌ی پیش‌بینی‌نشده','مشکل در رفت‌وآمد','آسیب‌دیدگی','سایر (توضیح دهید)'];
function reqForm(id){const u=U(meId),el=db.bookings.filter(b=>b.uid==u.id&&b.status=='active'&&!pend(b.id)&&(st(b.date,b.start)-Date.now())/36e5<2&&st(b.date,b.start).getTime()+b.dur*6e4>Date.now());
 openM(`<h3>درخواست لغو دیرهنگام</h3><div class="bn warn">${ic('info')}<small>لغو در فاصله کمتر از ۲ ساعت تا شروع سانس، تنها با تأیید مدیر انجام می‌شود.</small></div>${el.length?`<label>رزرو موردنظر</label><select id="rb" class="in">${el.map(b=>`<option value="${b.id}" ${b.id==id?'selected':''}>${rel(b.date)}، ${rg(b.start,b.dur)}</option>`).join('')}</select><label>دلیل لغو</label><select id="rs" class="in">${RS.map(x=>`<option>${x}</option>`).join('')}</select><label>توضیحات (اختیاری)</label><textarea id="rr" class="in" placeholder="توضیحات بیشتر..."></textarea><div class="ac2"><button class="bt" onclick="sendReq()">ارسال درخواست</button><button class="bt o" onclick="closeM()">انصراف</button></div>`:`<p>در حال حاضر رزروی ندارید که کمتر از ۲ ساعت به شروعش مانده باشد.</p><button class="bt o" onclick="closeM()">بستن</button>`}`)}
function sendReq(){const id=+$('#rb').value,rs=$('#rs').value,t=$('#rr').value.trim(),b=BK(id),u=U(meId);
 if(rs.startsWith('سایر')&&t.length<3)return toast('لطفاً دلیل درخواست را توضیح دهید.','er');
 const reason=rs+(t?' — '+t:'');
 db.reqs.push({id:db.nid++,bid:id,uid:u.id,reason,status:'p',time:Date.now()});
 db.msgs.push({id:db.nid++,uid:u.id,from:'a',time:Date.now(),text:`درخواست لغو دیرهنگام برای سانس ${rel(b.date)}، ${rg(b.start,b.dur)} — دلیل: ${reason}`});
 act('rq',u.name,'درخواست لغو ارسال کرد.');note('درخواست لغو جدید',`${u.name} درخواست لغو سانس ${rel(b.date)} را ارسال کرد.`,'o');
 closeM();save();toast('درخواست لغو برای مدیر ارسال شد.')}
function decide(id,ok){const r=db.reqs.find(x=>x.id==id),b=BK(r.bid);r.status=ok?'ok':'no';
 if(ok&&b.status=='active'){b.status='cancelled';U(b.uid).sessions++}const tx=`درخواست لغو شما برای سانس ${rel(b.date)}، ${rg(b.start,b.dur)} ${ok?'تأیید شد و یک جلسه به عضویت شما بازگشت.':'رد شد و رزرو شما باقی می‌ماند.'}`;db.msgs.push({id:db.nid++,uid:r.uid,from:'m',time:Date.now(),text:tx});note(ok?'درخواست لغو تأیید شد':'درخواست لغو رد شد',tx,ok?'g':'o',r.uid);save();toast(ok?'درخواست تأیید شد و جلسه به ورزشکار بازگشت.':'درخواست رد شد؛ رزرو باقی می‌ماند.')}
const mark=(id,s)=>{BK(id).status=s;save()};

/* ===== اعضا ===== */
function memForm(id){const u=id?U(id):{name:'',email:'',pass:'',expiry:addD(30),sessions:12};
 openM(`<h3>${id?'ویرایش عضو':'افزودن عضو جدید'}</h3><label>نام و نام خانوادگی</label><input id="fn" class="in" value="${esc(u.name)}"><label>ایمیل (نام کاربری)</label><input id="fe" class="in" dir="ltr" value="${esc(u.email)}"><label>رمز عبور</label><input id="fpw" class="in" dir="ltr" value="${esc(u.pass)}"><label>تاریخ پایان عضویت</label><input id="fx" type="date" class="in" value="${u.expiry}"><label>تعداد جلسات باقی‌مانده</label><input id="fs" type="number" min="0" class="in" value="${u.sessions}"><div class="ac2"><button class="bt" onclick="memSave(${id||0})">ذخیره</button><button class="bt o" onclick="closeM()">انصراف</button></div>`)}
function memSave(id){const n=$('#fn').value.trim(),e=$('#fe').value.trim().toLowerCase(),p=$('#fpw').value,x=$('#fx').value,s=$('#fs').value;
 if(!n||!e||!p||!x||s==='')return toast('همه‌ی فیلدها باید پر شوند.','er');
 if(!/^\S+@\S+\.\S+$/.test(e))return toast('ایمیل واردشده معتبر نیست.','er');
 if(+s<0)return toast('تعداد جلسات نمی‌تواند منفی باشد.','er');
 if(db.users.some(u=>u.email==e&&u.id!=id))return toast('این ایمیل قبلاً ثبت شده است.','er');
 if(id)Object.assign(U(id),{name:n,email:e,pass:p,expiry:x,sessions:+s});
 else{const i=db.nid++;db.users.push({id:i,name:n,email:e,pass:p,role:'a',expiry:x,sessions:+s,code:1000+i,joined:today(),pack:Math.max(+s,12),startD:today()});act('mem',n,'به اعضا اضافه شد.')}
 closeM();F.mp=1;save();toast('اطلاعات عضو ذخیره شد.')}
const mf=()=>db.users.filter(u=>u.role=='a'&&(!F.mq||(u.name+u.email).toLowerCase().includes(F.mq.toLowerCase()))&&(!F.mst||mst(u)[0]==F.mst)&&(!F.mse||(F.mse=='0'?u.sessions==0:F.mse=='low'?u.sessions>=1&&u.sessions<=5:u.sessions>5)));
const upd=(id,fn)=>{$('#'+id).innerHTML=window[fn]();lu()};
const pgo=(k,id,fn,n)=>{F[k]=n;upd(id,fn)};
const fset=(k,v,pk,id,fn)=>{F[k]=v;F[pk]=1;upd(id,fn)};
const pager=(n,c,z,k,id,fn,u)=>{const t=Math.max(1,Math.ceil(n/z)),b=(i,x,a)=>`<button class="pb ${a?'on':''}" ${i<1||i>t?'disabled':''} onclick="pgo('${k}','${id}','${fn}',${i})">${x}</button>`;
 return `<div class="pgr"><small>نمایش ${P(n?(c-1)*z+1:0)} تا ${P(Math.min(n,c*z))} از ${P(n)} ${u}</small><div>${b(c-1,ic('chevron-right'))}${[...Array(t)].map((_,i)=>b(i+1,P(i+1),i+1==c)).join('')}${b(c+1,ic('chevron-left'))}</div></div>`};
function memTbl(){const l=mf(),p=l.slice((F.mp-1)*5,F.mp*5);
 return `<div class="tw"><table><tr><th>نام عضو</th><th>ایمیل</th><th>تاریخ پایان عضویت</th><th>جلسات باقی‌مانده</th><th>وضعیت</th><th></th></tr>${p.map(u=>`<tr><td><div class="who">${av(u.name)}<b>${esc(u.name)}</b></div></td><td dir="ltr" class="r">${esc(u.email)}</td><td>${fd0(u.expiry)}</td><td>${P(u.sessions)} جلسه</td><td>${bd(mst(u))}</td><td><button class="ib" onclick="memForm(${u.id})">${ic('pencil')}</button></td></tr>`).join('')||'<tr><td colspan="6">عضوی یافت نشد.</td></tr>'}</table></div>${pager(l.length,F.mp,5,'mp','mt','memTbl','عضو')}`}

function hoursForm(){openM(`<h3>ویرایش ساعات کاری</h3>${ORD.map(d=>{const h=db.hours[d]||{o:'07:00',c:'21:00'};return `<div class="fl" style="align-items:center;margin-bottom:8px"><label style="width:80px"><input type="checkbox" id="ho${d}" ${db.hours[d]?'checked':''}> ${WD[d]}</label><input type="time" id="hs${d}" class="in" value="${h.o}"><input type="time" id="he${d}" class="in" value="${h.c}"></div>`}).join('')}<div class="ac2"><button class="bt" onclick="hoursSave()">ذخیره</button><button class="bt o" onclick="closeM()">انصراف</button></div>`)}
function hoursSave(){const h={};
 for(const d of ORD){if(!$('#ho'+d).checked){h[d]=null;continue}const o=$('#hs'+d).value,c=$('#he'+d).value;
  if(!o||!c||mins(c)-mins(o)<30)return toast('ساعت پایان '+WD[d]+' باید بعد از ساعت شروع باشد.','er');h[d]={o,c}}
 db.hours=h;closeM();save();toast('ساعات کاری ذخیره شد.')}
function slotForm(w,id){const s=id?db.slots[w].find(x=>x.id==id):{start:'08:00',dur:120,cap:12};
 openM(`<h3>${id?'ویرایش سانس':'تعریف سانس جدید'}</h3>${id?'':`<label>روز هفته</label><select id="sw" class="in">${ORD.filter(d=>db.hours[d]).map(d=>`<option value="${d}" ${d==w?'selected':''}>${WD[d]}</option>`).join('')}</select>`}<label>ساعت شروع</label><input id="ss" type="time" class="in" value="${s.start}"><label>مدت سانس (دقیقه)</label><input id="sdu" type="number" class="in" value="${s.dur}"><label>ظرفیت (نفر)</label><input id="sc" type="number" class="in" value="${s.cap}"><div class="ac2"><button class="bt" onclick="slotSave(${w},${id||0})">ذخیره</button>${id?`<button class="bt rd" onclick="slotDel(${w},${id})">حذف</button>`:''}<button class="bt o" onclick="closeM()">انصراف</button></div>`)}
function slotSave(w0,id){const w=id?w0:+$('#sw').value,start=$('#ss').value,dur=+$('#sdu').value,cap=+$('#sc').value,h=db.hours[w];
 if(!h)return toast('این روز تعطیل است.','er');
 if(!start||dur<30||cap<1)return toast('ساعت شروع، مدت (حداقل ۳۰ دقیقه) و ظرفیت (حداقل ۱) را درست وارد کنید.','er');
 if(mins(start)<mins(h.o)||mins(start)+dur>mins(h.c))return toast('سانس باید داخل ساعات کاری باشگاه باشد.','er');
 if(db.slots[w].some(x=>x.id!=id&&mins(start)<mins(x.start)+x.dur&&mins(x.start)<mins(start)+dur))return toast('این سانس با سانس دیگری هم‌پوشانی دارد.','er');
 if(id)Object.assign(db.slots[w].find(x=>x.id==id),{start,dur,cap});else db.slots[w].push({id:db.nid++,start,dur,cap});
 closeM();save();toast('سانس ذخیره شد.')}
function slotDel(w,id){if(!confirm('این سانس حذف شود؟'))return;db.slots[w]=db.slots[w].filter(x=>x.id!=id);closeM();save()}

 if(!r)return toast('دلیل مسدودسازی را بنویسید.','er');
